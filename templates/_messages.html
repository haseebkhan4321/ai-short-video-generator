{% if messages %}
  <ul class="messages">
    {% for message in messages %}
      <li class="{{ message.tags }}">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
          {% if 'success' in message.tags %}<use href="#i-check"/>
          {% elif 'error' in message.tags or 'warning' in message.tags %}<use href="#i-alert"/>
          {% else %}<use href="#i-info"/>{% endif %}
        </svg>
        <span>{{ message }}</span>
      </li>
    {% endfor %}
  </ul>
{% endif %}
