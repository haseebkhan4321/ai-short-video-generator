{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI Story Video Studio{% endblock %}</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #191c23; --panel-2: #21252e;
      --text: #e6e8ec; --muted: #9aa2ad; --border: #2b303a;
      --accent: #6c8cff; --green: #3fb950; --red: #f85149;
      --amber: #d29922;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header.topbar {
      display: flex; align-items: center; gap: 20px;
      padding: 14px 24px; background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    header.topbar .brand { font-weight: 700; color: var(--text); }
    header.topbar nav a { color: var(--muted); margin-right: 16px; }
    main { max-width: 1100px; margin: 0 auto; padding: 28px 24px; }
    h1, h2, h3 { line-height: 1.25; }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 18px 20px; margin-bottom: 18px;
    }
    .btn {
      display: inline-block; padding: 8px 14px; border-radius: 7px;
      background: var(--accent); color: #fff; border: none; cursor: pointer;
      font-size: 14px;
    }
    .btn:hover { text-decoration: none; opacity: .92; }
    .btn.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
    .btn.green { background: var(--green); }
    .btn.red { background: var(--red); }
    .muted { color: var(--muted); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 13px; }
    .badge {
      display: inline-block; padding: 2px 9px; border-radius: 20px;
      font-size: 12px; font-weight: 600; background: var(--panel-2);
      border: 1px solid var(--border); color: var(--muted);
    }
    .badge.green { color: var(--green); border-color: var(--green); }
    .badge.red { color: var(--red); border-color: var(--red); }
    .badge.amber { color: var(--amber); border-color: var(--amber); }
    .badge.accent { color: var(--accent); border-color: var(--accent); }
    input, textarea, select {
      width: 100%; padding: 9px 11px; background: var(--panel-2);
      border: 1px solid var(--border); border-radius: 7px; color: var(--text);
      font: inherit;
    }
    label { display: block; margin: 12px 0 5px; font-size: 14px; color: var(--muted); }
    .messages { list-style: none; padding: 0; margin: 0 0 18px; }
    .messages li { padding: 10px 14px; border-radius: 7px; margin-bottom: 8px; }
    .messages .success { background: rgba(63,185,80,.15); border: 1px solid var(--green); }
    .messages .error { background: rgba(248,81,73,.15); border: 1px solid var(--red); }
    .messages .warning { background: rgba(210,153,34,.15); border: 1px solid var(--amber); }
    .row { display: flex; gap: 16px; flex-wrap: wrap; }
    .inline-form { display: inline; }
    .progress-indeterminate {
      position: relative; height: 4px; width: 90px; background: var(--border);
      border-radius: 2px; overflow: hidden; display: inline-block; vertical-align: middle;
    }
    .progress-indeterminate::after {
      content: ''; position: absolute; top: 0; left: -40%; height: 100%; width: 40%;
      background: var(--accent); border-radius: 2px; animation: indet 1.1s infinite ease-in-out;
    }
    @keyframes indet { 0% { left: -40%; } 100% { left: 100%; } }
    .spinner {
      flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%;
      border: 3px solid var(--border); border-top-color: var(--accent);
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .next-step { border-left: 4px solid var(--border); }
    .next-step.action { border-left-color: var(--accent); }
    .next-step.wait { border-left-color: var(--amber); }
    .next-step.done { border-left-color: var(--green); }
    .next-step.error { border-left-color: var(--red); }
    .next-step .kicker {
      font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
    }
    .cost-tag {
      display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 12px;
      font-size: 12px; font-weight: 700; background: rgba(0,0,0,.22);
    }
    .cost-tag.free { background: rgba(63,185,80,.22); }
    .stepper { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .stepper .step {
      font-size: 12px; font-weight: 600; padding: 3px 11px; border-radius: 20px;
      border: 1px solid var(--border); color: var(--muted); white-space: nowrap;
    }
    .stepper .step.done { color: var(--green); border-color: var(--green); }
    .stepper .step.current {
      color: var(--accent); border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108,140,255,.12);
    }
    .stepper .step.failed { color: var(--red); border-color: var(--red); }
    .stepper .step-sep { width: 14px; height: 1px; background: var(--border); }
    .player {
      display: flex; align-items: center; gap: 12px;
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 14px;
    }
    .player-btn {
      flex: 0 0 auto; width: 32px; height: 32px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      background: none; border: none; border-radius: 50%;
      color: var(--text); cursor: pointer;
    }
    .player-btn:hover { background: rgba(255,255,255,.08); }
    .player-btn svg { width: 16px; height: 16px; fill: currentColor; }
    .player-time {
      flex: 0 0 auto; font-size: 12px; color: var(--muted);
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .player-seek {
      -webkit-appearance: none; appearance: none;
      flex: 1; min-width: 60px; height: 4px; margin: 0; padding: 0;
      background: var(--border); border: none; border-radius: 2px; cursor: pointer;
    }
    .player-seek::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px;
      border-radius: 50%; background: var(--accent); border: none;
    }
    .player-seek::-moz-range-thumb {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--accent); border: none;
    }
    .player-seek::-moz-range-progress { height: 4px; background: var(--accent); border-radius: 2px; }
    .player-rate {
      flex: 0 0 auto; width: 44px; padding: 2px 0; background: none;
      border: 1px solid var(--border); border-radius: 20px;
      color: var(--muted); font-size: 11px; font-weight: 600; cursor: pointer;
    }
    .player-rate:hover { color: var(--text); border-color: var(--muted); }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="brand">🎬 AI Story Video Studio</span>
    <nav>
      <a href="{% url 'profiles:list' %}">Profiles</a>
      <a href="{% url 'videos:list' %}">Videos</a>
    </nav>
  </header>
  <main>
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <script>
    // Custom audio players (.player, see videos/_audio_player.html).
    (function () {
      var players = document.querySelectorAll('.player');
      if (!players.length) return;
      var RATES = [1, 1.25, 1.5, 1.75, 2];

      function fmt(seconds) {
        if (!isFinite(seconds) || seconds < 0) return '0:00';
        var s = Math.floor(seconds), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
        var sec = String(s % 60).padStart(2, '0');
        return h ? h + ':' + String(m).padStart(2, '0') + ':' + sec : m + ':' + sec;
      }

      // NB: SVG elements do not support the .hidden IDL property, so toggle display.
      function show(el, visible) { if (el) el.style.display = visible ? '' : 'none'; }

      players.forEach(function (el) {
        var audio = el.querySelector('audio');
        var playBtn = el.querySelector('[data-play]');
        var iconPlay = el.querySelector('[data-icon-play]');
        var iconPause = el.querySelector('[data-icon-pause]');
        var time = el.querySelector('[data-time]');
        var seek = el.querySelector('[data-seek]');
        var rateBtn = el.querySelector('[data-rate]');
        var muteBtn = el.querySelector('[data-mute]');
        var iconVol = el.querySelector('[data-icon-vol]');
        var iconMuted = el.querySelector('[data-icon-muted]');
        var seeking = false;

        function render() {
          var dur = audio.duration;
          var cur = seeking && isFinite(dur) ? (seek.value / 1000) * dur : audio.currentTime;
          time.textContent = fmt(cur) + ' / ' + fmt(dur);
          if (!seeking) seek.value = isFinite(dur) && dur ? Math.round((audio.currentTime / dur) * 1000) : 0;
          var pct = seek.value / 10;
          seek.style.background =
            'linear-gradient(to right, var(--accent) ' + pct + '%, var(--border) ' + pct + '%)';
        }

        playBtn.addEventListener('click', function () {
          if (audio.paused) audio.play(); else audio.pause();
        });
        audio.addEventListener('play', function () {
          show(iconPlay, false); show(iconPause, true);
          playBtn.setAttribute('aria-label', 'Pause');
          // Only one player at a time.
          document.querySelectorAll('.player audio').forEach(function (other) {
            if (other !== audio) other.pause();
          });
        });
        audio.addEventListener('pause', function () {
          show(iconPlay, true); show(iconPause, false);
          playBtn.setAttribute('aria-label', 'Play');
        });
        audio.addEventListener('loadedmetadata', render);
        audio.addEventListener('timeupdate', function () { if (!seeking) render(); });
        audio.addEventListener('ended', render);

        seek.addEventListener('input', function () { seeking = true; render(); });
        seek.addEventListener('change', function () {
          if (isFinite(audio.duration)) audio.currentTime = (seek.value / 1000) * audio.duration;
          seeking = false;
          render();
        });

        rateBtn.addEventListener('click', function () {
          var next = RATES[(RATES.indexOf(audio.playbackRate) + 1) % RATES.length] || 1;
          audio.playbackRate = next;
          rateBtn.textContent = next + '×';
        });

        muteBtn.addEventListener('click', function () { audio.muted = !audio.muted; });
        audio.addEventListener('volumechange', function () {
          show(iconVol, !audio.muted); show(iconMuted, audio.muted);
          muteBtn.setAttribute('aria-label', audio.muted ? 'Unmute' : 'Mute');
        });

        render();
      });
    })();

    // Enable browser autocorrect / spellcheck / sentence auto-capitalization on
    // all free-text fields (textareas and text/search inputs).
    (function () {
      var sel = 'textarea, input[type="text"], input[type="search"], input:not([type])';
      document.querySelectorAll(sel).forEach(function (el) {
        el.setAttribute('spellcheck', 'true');
        el.setAttribute('autocorrect', 'on');
        el.setAttribute('autocapitalize', 'sentences');
      });
    })();
  </script>
</body>
</html>
