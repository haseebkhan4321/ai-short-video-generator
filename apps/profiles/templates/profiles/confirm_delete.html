{% extends "base.html" %}
{% block title %}Delete {{ profile.name }}{% endblock %}
{% block content %}
  <h1>Delete profile</h1>
  <div class="card" style="max-width: 640px;">
    <p>Delete <strong>{{ profile.name }}</strong>? This also deletes its
      {{ profile.videos.count }} video(s) and all their generated data. This cannot be undone.</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn red">Delete permanently</button>
      <a class="btn secondary" href="{% url 'profiles:detail' profile.pk %}">Cancel</a>
    </form>
  </div>
{% endblock %}
