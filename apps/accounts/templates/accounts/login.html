{% extends "base_public.html" %}
{% block title %}Sign in{% endblock %}
{% block public_width %}narrow{% endblock %}

{% block content %}
  <div class="auth-card">
    <div class="auth-head">
      <h1>Sign in</h1>
      <p>Welcome back.</p>
    </div>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "_fields.html" %}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn block mt">Sign in</button>
    </form>
    <div class="auth-foot">
      No account? <a href="{% url 'accounts:request' %}">Request one</a>.
    </div>
  </div>
{% endblock %}
